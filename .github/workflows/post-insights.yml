name: 投稿の数字を取る

# 代表 10/13「問いかけ系のインタラクションの数値は？」（統括経由）。出た投稿ごとの閲覧・いいね・返信などを
# insights/投稿の数字.jsonl に残す（非公開の odekake-data の ekimae/ に置く。公開リポジトリには置かない）。毎日 5:10 JST と、手で起動したとき。
on:
  schedule:
    - cron: "10 20 * * *"
  workflow_dispatch:

jobs:
  insights:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 非公開の置き場から写す
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_DIR: ekimae
        run: ./scripts/非公開.sh pull
      - name: 取る
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python "scripts/投稿の数字.py" > /dev/null  # 公開リポジトリのログ・要約に数字を出さない（代表 10/13）
      - name: 非公開の置き場に置く
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_DIR: ekimae
        run: |
          set +e
          ./scripts/非公開.sh push "insights/投稿の数字.jsonl" "chore(insights): 投稿の数字を更新"
          rc=$?
          set -e
          # 鍵が無い（2）ときも、公開リポジトリには置かない
          if [ "$rc" -ne 0 ]; then echo "::error::非公開の置き場に置けませんでした（$rc）"; exit 1; fi
