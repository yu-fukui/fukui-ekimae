name: 投稿の数字を取る

# 代表 10/13「問いかけ系のインタラクションの数値は？」（統括経由）。出た投稿ごとの閲覧・いいね・返信などを
# insights/投稿の数字.jsonl に残す。毎日 5:10 JST と、手で起動したとき。
on:
  schedule:
    - cron: "10 20 * * *"
  workflow_dispatch:

jobs:
  insights:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 取る
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python "scripts/投稿の数字.py" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: コミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -N "insights/投稿の数字.jsonl"
          ./scripts/commit_file.sh "insights/投稿の数字.jsonl" "chore(insights): 投稿の数字を更新"
