name: 片町ガイドの一覧を更新

on:
  schedule:
    - cron: "17 20 * * *"   # 毎朝 5:17（日本時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: お店の一覧を作り直す
        run: python scripts/build_guide.py
      - name: コミットする
        run: |
          # ガイドとサイトマップを1回でコミットする（別々にすると、もう片方の変更が残って pull --rebase が断られる。10/18 の失敗）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/katamachi/index.html docs/sitemap.xml
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -q -m "chore(guide): 片町ガイドのお店一覧を更新"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
