name: GA を読む

# 代表 10/13「GA読み取りもできるようにして」。見た人・経路・見られたお店などを insights/ga/ に残す。
# 毎日 9:20 JST と、手で起動したとき。鍵は Search Console と同じ GSC_SERVICE_ACCOUNT_JSON。
# 代表 10/13「非公開リポジトリを作って管理して」：公開リポジトリには数字を書かない。非公開の odekake-data に引っ越すまで、自動では動かさない。
on:
  workflow_dispatch:

jobs:
  ga:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-auth requests
      - name: 取る
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID || secrets.GA4_PROPERTY_ID }}
        run: python scripts/ga_report.py > /dev/null  # 公開リポジトリのログにも数字を出さない
